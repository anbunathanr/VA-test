{% extends "base.html" %}
{% block title %}Sign In — DigiTran Solutions{% endblock %}

{% block content %}
<h2>Create Your Account</h2>

<form action="/send-otp" method="POST" novalidate>

  <div class="form-group">
    <label for="full_name">Full Name</label>
    <input type="text" id="full_name" name="full_name"
           placeholder="Enter your full name" autocomplete="name" required />
  </div>

  <div class="form-group">
    <label for="email">Email Address</label>
    <input type="email" id="email" name="email"
           placeholder="Enter your email address" autocomplete="email" required />
  </div>

  <div class="form-group">
    <label for="mobile">Phone Number</label>
    <input type="tel" id="mobile" name="mobile"
           placeholder="Enter your phone number" autocomplete="tel" required />
  </div>

  <button type="submit" class="btn btn-primary">Get OTP</button>
</form>

<p style="text-align:center; font-size:12px; color:#aaa; margin-top:20px;">
  OTP will be displayed in the server terminal
</p>
{% endblock %}
